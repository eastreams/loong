[package]
name = "loac"
version = "0.2.0"
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
description = "Typed local actors with bounded mailboxes and structured supervision"
readme = "README.md"
repository = "https://github.com/eastreams/loong"
keywords = ["actor", "async", "concurrency", "supervision"]
categories = ["asynchronous", "concurrency"]
autoexamples = false

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
loac-macros = { version = "0.2.0", path = "../actor-macros" }
pin-project-lite = "0.2.16"
slotmap = { version = "1.1.1", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
actix = { version = "=0.13.5", default-features = false }
allocation-counter = "0.8.1"
criterion = { version = "0.5.1", default-features = false, features = ["async_tokio"] }
oorandom = "=11.1.5"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
trybuild = "1.0.118"

[[example]]
name = "ready_reply"
path = "examples/dispatch/ready_reply.rs"

[[example]]
name = "sync_handler"
path = "examples/sync_handler.rs"

[[example]]
name = "streaming"
path = "examples/dispatch/streaming.rs"

[[example]]
name = "stream_strategies"
path = "examples/dispatch/stream_strategies.rs"

[[example]]
name = "stream_to"
path = "examples/stream_to.rs"

[[example]]
name = "cx_reply"
path = "examples/cx_reply.rs"

[[example]]
name = "actor_configuration"
path = "examples/configuration/actor_configuration.rs"

[[example]]
name = "const_generic_configuration"
path = "examples/configuration/const_generic_configuration.rs"

[[example]]
name = "explicit_replies"
path = "examples/dispatch/replies/explicit_replies.rs"

[[example]]
name = "interleaved_reply"
path = "examples/dispatch/replies/interleaved_reply.rs"

[[example]]
name = "exclusive_reply"
path = "examples/dispatch/replies/exclusive_reply.rs"

[[example]]
name = "cx_exclusive"
path = "examples/dispatch/cx_exclusive.rs"

[[example]]
name = "top_level_actors"
path = "examples/topology/top_level_actors.rs"

[[example]]
name = "child_actors"
path = "examples/topology/child_actors.rs"

[[example]]
name = "address_cycle"
path = "examples/topology/address_cycle.rs"

[[bench]]
name = "message_round_trip"
harness = false

[[bench]]
name = "reply_execution"
harness = false

[[bench]]
name = "mailbox_saturation"
harness = false

[[bench]]
name = "reply_allocations"
harness = false

[[bench]]
name = "actor_runtime_comparison"
harness = false

[lints]
workspace = true
