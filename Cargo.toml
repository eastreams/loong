[workspace]
members = [
    "apps/loong",
    "crates/actor",
    "crates/actor-macros",
    "crates/contracts",
    "crates/kernel",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
loong-contracts = { path = "crates/contracts" }
loong-kernel = { path = "crates/kernel" }
loac = { path = "crates/actor" }

bincode = "1.3.3"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.91"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "macros"] }
uuid = "1.24.0"
