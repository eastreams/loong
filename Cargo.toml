[workspace]
members = [
    "apps/loong",
    "crates/actor",
    "crates/tool-host",
    "crates/tools",
    "crates/actor-macros",
    "crates/agent",
    "crates/context",
    "crates/contracts",
    "crates/kernel",
    "crates/provider",
    "crates/provider-openai",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
contracts = { path = "crates/contracts", package = "loong-contracts" }
kernel = { path = "crates/kernel", package = "loong-kernel" }
tool_host = { path = "crates/tool-host", package = "loong-tool-host" }
tools = { path = "crates/tools", package = "loong-tools" }
context = { path = "crates/context", package = "loong-context" }
agent = { path = "crates/agent", package = "loong-agent" }
loac = { path = "crates/actor" }
provider = { path = "crates/provider", package = "loong-provider" }
provider-openai = { path = "crates/provider-openai", package = "loong-provider-openai" }

bincode = "1.3.3"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.91"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "macros"] }
uuid = { version = "1.24.0", default-features = false }
